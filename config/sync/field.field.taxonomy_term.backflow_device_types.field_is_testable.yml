label: 'Testable assembly'
description: "A testable assembly has test cocks and shutoff valves and is subject to Colorado's annual certification requirement (Reg 11.39 §11.39). A non-testable device — AVB, dual check, hose bibb breaker — cannot be gauge-tested in place and is inspected and replaced on condition. Devices of a non-testable type must not receive a next-due date or appear in compliance reminders."
