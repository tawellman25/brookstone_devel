name: 'BOS Block Plugin Performance'
type: module
description: 'Prunes the field_block and extra_field_block definitions Layout Builder derives for bundles that have no Layout Builder display. BOS has 90+ ECK entity types and thousands of fields, so the deriver generates ~13,500 definitions of which only ~1,300 are reachable; the rest cost memory on every block-plugin cache build for nothing. Layout Builder keeps working on every display that uses it. Reversible by uninstalling.'
package: 'BOS Utility'
core_version_requirement: ^10 || ^11
