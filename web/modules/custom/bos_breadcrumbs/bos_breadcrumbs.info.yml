name: 'BOS Breadcrumbs'
type: module
description: 'Alias-based breadcrumb trails for PUBLIC taxonomy term pages in an explicit vocabulary allowlist (services, material_types, backflow_device_types, backflow_uses). Overrides core''s hierarchy-based taxonomy breadcrumb for those vocabularies only; every other term falls through to core.'
package: Custom
core_version_requirement: ^10 || ^11
dependencies:
  - drupal:taxonomy
