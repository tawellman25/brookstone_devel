services:
  # Priority MUST be above core's taxonomy_term.breadcrumb (1002) so this claims
  # the allowlisted vocabularies' term pages before core's hierarchy builder.
  # Path-based default is 0; core taxonomy is 1002; webform 1002/1003. 1010 is
  # safely above all of them. applies() returns FALSE for everything except the
  # four allowlisted vocabularies, so all other term pages keep core behaviour.
  bos_breadcrumbs.term_alias_breadcrumb:
    class: Drupal\bos_breadcrumbs\BosTermAliasBreadcrumbBuilder
    arguments:
      - '@router.request_context'
      - '@access_manager'
      - '@router'
      - '@path_processor_manager'
      - '@config.factory'
      - '@title_resolver'
      - '@current_user'
      - '@path.current'
      - '@path.matcher'
      - '@entity_type.manager'
    tags:
      - { name: breadcrumb_builder, priority: 1010 }
