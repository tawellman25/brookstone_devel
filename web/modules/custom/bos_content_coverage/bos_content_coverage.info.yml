name: 'BOS Content Coverage'
type: module
description: 'Admin report of what public-facing copy is actually LIVE on every public taxonomy term — populated/empty, character counts, URL alias, and a boilerplate flag. Answers "what is live?" from the database so neither marketing nor Code has to infer it from a copy file or a build log.'
package: Custom
core_version_requirement: ^10 || ^11
dependencies:
  - drupal:taxonomy
  - drupal:views
