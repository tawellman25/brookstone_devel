name: 'BOS Equipment'
type: module
description: 'Cross-cutting equipment behavior: reliable auto-titles for equipment bundles with no auto_entitylabel pattern (e.g. power_tools), the equipment_types term-name fallback (name → field_common_name), and role-aware equipment presentation. Formerly "Equipment Labels".'
package: 'Material/Equipment'
core_version_requirement: ^10 || ^11
dependencies:
  - drupal:taxonomy
  - auto_entitylabel:auto_entitylabel
