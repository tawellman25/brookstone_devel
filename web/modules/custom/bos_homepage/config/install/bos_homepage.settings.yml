steps_h2: 'What happens after you call'
steps_intro: 'A landscape project is a large thing to hand to somebody. Here is exactly how ours go, so you know what you are agreeing to before you agree to it.'
steps:
  - title: 'We come look at it'
    body: 'No charge, no obligation. We walk the property with you, listen to what you actually want out of the space, and talk honestly about what the budget will and will not reach. Some of the best conversations we have end with us telling somebody to do it in two phases.'
  - title: 'We design it'
    body: 'You get a real plan — layout, materials, plantings, grading, irrigation and lighting — not a sketch on the back of an estimate. You see the space before anybody breaks ground, and changes on paper are free.'
  - title: 'We build it'
    body: 'Our own crews, our own equipment. We are not subcontracting your patio to whoever is available that week. You get a schedule, and if the schedule moves, you hear it from us first.'
  - title: 'We maintain it'
    body: 'This is the part most companies skip. A landscape is not finished when the crew leaves — it is finished about three years later, when it has filled in the way it was drawn. We handle the lawn care, irrigation, pruning and lighting that get it there.'
steps_cta_label: 'Get a Free Estimate'
who_h2: 'A local company, at some scale'
who_body: "Brookstone Outdoors has been working in Delta and Montrose counties for over thirty years. We run five departments, around twenty-five people, and twenty-one trucks with equipment and trailers.\n\nThat scale matters more than it sounds like it should. It is the reason we can put a real crew on a design-build project and still get your lawn mowed on Thursday. It is the reason we can hold a snow contract and actually show up for every storm instead of the convenient ones. And it is the reason a property manager can hand us a commercial site and get one vendor instead of six.\n\nWe are licensed and insured, we carry our own equipment, and we are here in April when something needs fixing."
