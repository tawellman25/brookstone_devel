bos_homepage.settings:
  type: config_object
  label: 'BOS Homepage settings'
  mapping:
    hero_eyebrow: { type: label }
    hero_headline: { type: label }
    hero_subhead: { type: text }
    hero_primary_label: { type: label }
    hero_primary_url: { type: string }
    hero_secondary_label: { type: label }
    hero_secondary_url: { type: string }
    promo_enabled: { type: boolean }
    promo_eyebrow: { type: label }
    promo_text: { type: text }
    promo_cta_label: { type: label }
    promo_cta_url: { type: string }
    trust:
      type: sequence
      sequence: { type: label }
    services_h2: { type: label }
    services_intro: { type: text }
    services:
      type: sequence
      sequence:
        type: mapping
        mapping:
          title: { type: label }
          blurb: { type: text }
          url: { type: string }
    proof_h2: { type: label }
    proof_intro: { type: text }
    steps_h2: { type: label }
    steps_intro: { type: text }
    steps:
      type: sequence
      sequence:
        type: mapping
        mapping:
          title: { type: label }
          body: { type: text }
    steps_cta_label: { type: label }
    who_h2: { type: label }
    who_body: { type: text }
    stats:
      type: sequence
      sequence:
        type: mapping
        mapping:
          number: { type: label }
          label: { type: label }
    service_area: { type: text }
    careers_h2: { type: label }
    careers_body: { type: text }
    careers_button_label: { type: label }
    careers_url: { type: string }
