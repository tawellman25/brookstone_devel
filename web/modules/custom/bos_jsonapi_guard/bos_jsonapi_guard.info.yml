name: 'BOS JSON:API Guard'
type: module
description: 'Requires authentication on every JSON:API route. The API stays fully available to logged-in users (and to a future teammate mobile app); anonymous visitors get 403. Uninstalling it is the rollback.'
package: 'BOS Infrastructure'
core_version_requirement: ^10 || ^11
dependencies:
  - drupal:jsonapi
