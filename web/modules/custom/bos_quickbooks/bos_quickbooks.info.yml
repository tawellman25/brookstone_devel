name: 'BOS QuickBooks'
type: module
description: 'QuickBooks Desktop integration through the QuickBooks Web Connector: the connector on the office PC polls this site, BOS mirrors customers / items / classes (qb_list) and links each QuickBooks customer to a BOS client by ListID. Phase 0 = sync + matching; invoice push (InvoiceAdd) is phase 2.'
package: 'BOS Billing'
core_version_requirement: ^11
dependencies:
  - drupal:system
  - drupal:views
  - drupal:options
  - drupal:datetime
  - drupal:user
  - eck:eck
  - profile:profile
