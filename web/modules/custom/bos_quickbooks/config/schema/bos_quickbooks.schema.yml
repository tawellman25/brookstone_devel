bos_quickbooks.settings:
  type: config_object
  label: 'BOS QuickBooks settings'
  mapping:
    username:
      type: string
      label: 'Web Connector user name (the UserName in the .qwc file)'
    alert_email:
      type: string
      label: 'Alert address (empty = site mail)'
    stale_hours:
      type: integer
      label: 'Hours without a complete sync before the mirror counts as stale'
    alert_interval:
      type: integer
      label: 'Seconds between stale-mirror alert emails'
    run_every_minutes:
      type: integer
      label: 'Web Connector polling interval written into the .qwc file'
    company_file:
      type: string
      label: 'Company file path the connector should open (empty = whatever is open)'
    qbxml_version:
      type: string
      label: 'Highest qbXML version BOS will speak'
    max_returned:
      type: integer
      label: 'Records per iterator page'
    app_name:
      type: string
      label: 'Application name shown in the Web Connector'
