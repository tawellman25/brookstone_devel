name: 'BOS Router Guard'
type: module
description: 'Detects a half-written router table (a rebuild terminated mid-write — the 2026-11-14 install.php outage), rebuilds it under the router lock, alerts by email and shows the state on the Status report. Uninstalling it is the complete rollback.'
package: 'BOS Infrastructure'
core_version_requirement: ^11
dependencies:
  - drupal:system
