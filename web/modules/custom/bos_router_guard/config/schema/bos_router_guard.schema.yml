bos_router_guard.settings:
  type: config_object
  label: 'BOS Router Guard settings'
  mapping:
    alert_email:
      type: string
      label: 'Alert address (empty = site mail)'
    rebuild_interval:
      type: integer
      label: 'Seconds between rebuild requests'
    alert_interval:
      type: integer
      label: 'Seconds between alert emails'
