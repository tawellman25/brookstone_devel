name: 'BOS Service Request'
type: module
description: 'Public service-request intake layer. Produces a controlled internal request record; a real Work Order is created only after office approval. Intake is never execution. (Gate 1: service_request ECK entity + status vocabulary.)'
package: 'BOS Intake'
core_version_requirement: ^10 || ^11
dependencies:
  - eck:eck
  - drupal:options
  - drupal:telephone
  - bos_wo_intake:bos_wo_intake
  - drupal:captcha
