# Tabs on the service-request queue page. A default task pointing back at the
# base route is required so the tab bar renders (≥2 tasks on one base_route).
bos_service_request.queue_tab:
  title: 'Queue'
  route_name: view.service_request_admin.page_1
  base_route: view.service_request_admin.page_1
  weight: 0

bos_service_request.report_tab:
  title: 'Report'
  route_name: bos_service_request.report
  base_route: view.service_request_admin.page_1
  weight: 1

bos_service_request.qr_tab:
  title: 'Postcard QR'
  route_name: bos_service_request.qr
  base_route: view.service_request_admin.page_1
  weight: 2
