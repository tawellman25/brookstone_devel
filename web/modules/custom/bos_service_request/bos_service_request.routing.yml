bos_service_request.winterize:
  path: '/winterize'
  defaults:
    _form: 'Drupal\bos_service_request\Form\WinterizeForm'
    _title: 'Sprinkler Winterization Signup'
  requirements:
    # Public, unauthenticated. The entity is created programmatically in the
    # submit handler (uid 0); captcha + flood + server-side matching are the
    # access boundary. Anonymous is NEVER granted an ECK create permission.
    _access: 'TRUE'
  options:
    no_cache: 'TRUE'

# "Check your service week" — pc26a ("already on our list") postcard destination.
# Public; reveals a schedule week ONLY on server-side contact corroboration
# (captcha + flood gated). No property element is ever rendered.
bos_service_request.check_week:
  path: '/winterize/week'
  defaults:
    _form: 'Drupal\bos_service_request\Form\CheckWeekForm'
    _title: 'Check Your Winterization Week'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: 'TRUE'

# Approve & Create Work Order — per-row confirm form (NOT a VBO bulk action, per
# the documented VBO footgun incidents). The confirm form provides Drupal form
# CSRF on the mutating POST; the converter is locked + idempotent.
bos_service_request.convert:
  path: '/admin/office/service-requests/{service_request}/convert'
  defaults:
    _form: 'Drupal\bos_service_request\Form\ServiceRequestConvertForm'
    _title: 'Approve & Create Work Order'
  requirements:
    _permission: 'administer service requests'
  options:
    _admin_route: 'TRUE'
    parameters:
      service_request:
        type: 'entity:service_request'

# Gate 5 — postcard QR asset (print-ready page) + raw PNG download.
bos_service_request.qr:
  path: '/admin/office/service-requests/qr'
  defaults:
    _controller: 'Drupal\bos_service_request\Controller\ServiceRequestQrController::page'
    _title: 'Campaign QRs'
  requirements:
    _permission: 'administer service requests'
  options:
    _admin_route: 'TRUE'

bos_service_request.qr_png:
  path: '/admin/office/service-requests/qr.png'
  defaults:
    _controller: 'Drupal\bos_service_request\Controller\ServiceRequestQrController::png'
  requirements:
    _permission: 'administer service requests'

# Gate 5 — campaign / source attribution report.
bos_service_request.report:
  path: '/admin/office/service-requests/report'
  defaults:
    _controller: 'Drupal\bos_service_request\Controller\ServiceRequestReportController::page'
    _title: 'Service request report'
  requirements:
    _permission: 'administer service requests'
  options:
    _admin_route: 'TRUE'

# Secondary actions: Mark Duplicate / Mark Already Covered / Reject.
bos_service_request.action:
  path: '/admin/office/service-requests/{service_request}/{op}'
  defaults:
    _form: 'Drupal\bos_service_request\Form\ServiceRequestActionForm'
    _title: 'Service request'
  requirements:
    _permission: 'administer service requests'
    op: 'duplicate|already-covered|reject'
  options:
    _admin_route: 'TRUE'
    parameters:
      service_request:
        type: 'entity:service_request'
