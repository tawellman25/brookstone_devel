bos_team_apparel.report:
  path: '/admin/operations/team_structure/teammates/apparel'
  defaults:
    _controller: 'Drupal\bos_team_apparel\Controller\ApparelReportController::report'
    _title: 'Shirt & Hat Sizes'
  requirements:
    _permission: 'view team apparel report'
  options:
    _admin_route: TRUE

# Retired path, kept so existing bookmarks still land on the report. No menu
# link — the report appears once, under Teammates.
bos_team_apparel.report_legacy:
  path: '/admin/people/apparel'
  defaults:
    _controller: 'Drupal\bos_team_apparel\Controller\ApparelReportController::legacyRedirect'
    _title: 'Shirt & Hat Sizes'
  requirements:
    _permission: 'view team apparel report'
  options:
    _admin_route: TRUE
