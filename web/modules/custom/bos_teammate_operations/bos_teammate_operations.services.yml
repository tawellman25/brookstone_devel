services:
  bos_teammate_operations.compensable_hours:
    class: Drupal\bos_teammate_operations\Service\CompensableHoursService
    arguments:
      - '@entity_type.manager'
      - '@config_pages.loader'
      - '@logger.factory'

  bos_teammate_operations.anomaly_detection:
    class: Drupal\bos_teammate_operations\Service\AnomalyDetectionService
    arguments:
      - '@entity_type.manager'
      - '@bos_teammate_operations.compensable_hours'
      - '@logger.factory'
      - '@config_pages.loader'

  bos_teammate_operations.open_punches:
    class: Drupal\bos_teammate_operations\Service\OpenPunchService
    arguments:
      - '@entity_type.manager'
      - '@wo_clock.clock_service'
      - '@date.formatter'
      - '@datetime.time'
      - '@config.factory'
