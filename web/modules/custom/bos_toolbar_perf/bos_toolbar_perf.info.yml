name: 'BOS Toolbar Performance'
type: module
description: 'Prunes the heavy per-view / per-bundle / per-entity-type developer links that admin_toolbar_tools injects into the admin menu. On BOS (545 views, 90+ ECK types, hundreds of bundles) that tree is thousands of links, all access-checked inline on every admin page — the per-entity-type permission forms alone each group 5,710 permissions — making every admin page take ~5-6s. Removing these families restores fast admin pages while keeping the useful add-content / collection / flush-cache shortcuts.'
package: 'BOS'
core_version_requirement: ^10 || ^11
