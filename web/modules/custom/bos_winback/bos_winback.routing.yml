bos_winback.list:
  path: '/admin/office/winterize/win-back'
  defaults:
    _controller: 'Drupal\bos_winback\Controller\WinbackController::list'
    _title: 'Winterize Win-Back'
  requirements:
    _permission: 'access winterize winback'

bos_winback.mark:
  path: '/admin/office/winterize/win-back/mark/{property}'
  defaults:
    _controller: 'Drupal\bos_winback\Controller\WinbackController::mark'
  methods: [POST]
  requirements:
    _permission: 'access winterize winback'
    _csrf_request_header_token: 'TRUE'
    property: '\d+'

bos_winback.create:
  path: '/admin/office/winterize/win-back/create/{property}'
  defaults:
    _controller: 'Drupal\bos_winback\Controller\WinbackController::createBooking'
  methods: [POST]
  requirements:
    _permission: 'access winterize winback'
    _csrf_request_header_token: 'TRUE'
    property: '\d+'

bos_winback.intel:
  path: '/admin/office/winterize/win-back/intel/{property}'
  defaults:
    _controller: 'Drupal\bos_winback\Controller\WinbackController::intel'
  methods: [POST]
  requirements:
    _permission: 'access winterize winback'
    _csrf_request_header_token: 'TRUE'
    property: '\d+'

bos_winback.report:
  path: '/admin/office/winterize/win-back/report'
  defaults:
    _controller: 'Drupal\bos_winback\Controller\WinbackController::report'
    _title: 'Win-Back Call Intelligence'
  requirements:
    _permission: 'access winterize winback'
