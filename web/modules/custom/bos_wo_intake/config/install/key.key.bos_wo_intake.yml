id: bos_wo_intake
label: 'Cowork Connect API Key'
description: 'API key for the Cowork Connect WO-intake endpoint. Secret is sourced from the BOS_WO_INTAKE_API_KEY environment variable (exported via settings.php putenv() per environment, off-git). The value is never stored in git or Drupal config.'
key_type: authentication
key_type_settings: {  }
key_provider: env
key_provider_settings:
  env_variable: BOS_WO_INTAKE_API_KEY
  base64_encoded: false
  strip_line_breaks: true
key_input: none
key_input_settings: {  }
