bos_wo_intake.settings:
  type: config_object
  label: 'BOS WO Intake settings'
  mapping:
    duplicate_window_days:
      type: integer
      label: 'Terminal-recent duplicate window (days)'
    synonym_map:
      type: sequence
      label: 'Service synonym phrase -> term id'
      sequence:
        type: integer
        label: 'Services term id'
    street_suffix_map:
      type: sequence
      label: 'Street suffix abbreviation -> canonical'
      sequence:
        type: string
        label: 'Canonical suffix'
