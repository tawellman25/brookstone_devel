name: 'Equipment Labels'
type: module
description: 'Reliable titles for equipment bundles that have no auto_entitylabel pattern (e.g. power_tools), and an equipment_types term-name fallback (name → field_common_name) so a term created with only a name is not saved blank.'
package: 'Material/Equipment'
core_version_requirement: ^10 || ^11
dependencies:
  - drupal:taxonomy
  - auto_entitylabel:auto_entitylabel
