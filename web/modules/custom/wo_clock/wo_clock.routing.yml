wo_clock.clock_in:
  path: '/clock/in/{wo_id}'
  defaults:
    _controller: '\Drupal\wo_clock\Controller\WoClockController::clockInAction'
  methods: [POST]
  requirements:
    _permission: 'access content'
    _csrf_request_header_token: 'TRUE'

wo_clock.clock_out:
  path: '/clock/out/{entry_id}'
  defaults:
    _controller: '\Drupal\wo_clock\Controller\WoClockController::clockOutAction'
  methods: [POST]
  requirements:
    _permission: 'access content'
    _csrf_request_header_token: 'TRUE'

wo_clock.close_entry:
  path: '/clock/close/{entry_id}'
  defaults:
    _controller: '\Drupal\wo_clock\Controller\WoClockController::closeEntryAction'
  methods: [POST]
  requirements:
    _permission: 'access content'
    _csrf_request_header_token: 'TRUE'

wo_clock.close_with_time:
  path: '/clock/close/{entry_id}/time'
  defaults:
    _controller: '\Drupal\wo_clock\Controller\WoClockController::closeEntryWithTimeAction'
  methods: [POST]
  requirements:
    _permission: 'access content'
    _csrf_request_header_token: 'TRUE'

# --- Crew clock ------------------------------------------------------------
# Deliberately `access content` like the individual routes, NOT a role: the
# crew leader changes from job to job, so gating on `supervisor` would block
# whoever is actually holding the phone. Who pressed the button is recorded on
# every entry instead.
wo_clock.crew_roster:
  path: '/clock/crew/roster/{wo_id}'
  defaults:
    _controller: '\Drupal\wo_clock\Controller\WoClockController::crewRosterAction'
  methods: [POST]
  requirements:
    _permission: 'access content'
    _csrf_request_header_token: 'TRUE'

wo_clock.crew_in:
  path: '/clock/crew/in/{wo_id}'
  defaults:
    _controller: '\Drupal\wo_clock\Controller\WoClockController::crewClockInAction'
  methods: [POST]
  requirements:
    _permission: 'access content'
    _csrf_request_header_token: 'TRUE'

wo_clock.crew_out:
  path: '/clock/crew/out/{wo_id}'
  defaults:
    _controller: '\Drupal\wo_clock\Controller\WoClockController::crewClockOutAction'
  methods: [POST]
  requirements:
    _permission: 'access content'
    _csrf_request_header_token: 'TRUE'
