name: 'WO Photo Split'
type: module
description: 'Splits multi-image wo_images media into one media entity per photo (automatically on upload + a one-time migration) so each photo carries its own public-gallery flag. Technicians still bulk-upload; the split is invisible.'
core_version_requirement: ^10 || ^11
package: 'Work Orders'
dependencies:
  - drupal:media
